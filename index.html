    function App() {
      const [lang, setLang] = useState('en');
      const t = (key) => TRANSLATIONS[lang][key] || TRANSLATIONS.en[key] || key;

      const [isSerialSupported, setIsSerialSupported] = useState(true);
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      // User-editable flasher options (kept in this single index.html)
      const [firmwareFamily, setFirmwareFamily] = useState('All Firmware');
      const [firmwareFamilies, setFirmwareFamilies] = useState(['All Firmware', ...INITIAL_FIRMWARE_FAMILIES]);
      const [categoryDescriptions, setCategoryDescriptions] = useState({ ...INITIAL_CATEGORY_DESCRIPTIONS });
      const [newFamilyName, setNewFamilyName] = useState('');
      const [deviceFilter, setDeviceFilter] = useState('All');
      const [boardSearch, setBoardSearch] = useState('');
      const [showAdvancedOptions, setShowAdvancedOptions] = useState(false);
      const [flashAddress, setFlashAddress] = useState('0x0');
      const [eraseAllFlash, setEraseAllFlash] = useState(false); 
      
      const [boards, setBoards] = useState(INITIAL_BOARDS);
      const [selectedBoardId, setSelectedBoardId] = useState(INITIAL_BOARDS[0].id);
      const selectedBoard = boards.find(b => b.id === selectedBoardId);

      const [localFile, setLocalFile] = useState(null);
      const [githubFirmwareStatus, setGithubFirmwareStatus] = useState('checking');
      const [githubFirmwareCheckedUrl, setGithubFirmwareCheckedUrl] = useState('');
      const localFileInputRef = useRef(null);
      const [bgUrl, setBgUrl] = useState(INITIAL_SETTINGS.bgUrl);
      const [logoUrl, setLogoUrl] = useState(INITIAL_SETTINGS.logoUrl);

      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminInput, setAdminInput] = useState("");
      const [adminTab, setAdminTab] = useState('firmware');
      const [loginError, setLoginError] = useState(false);

      const [showDonateModal, setShowDonateModal] = useState(false);
      const [copied, setCopied] = useState(false);

      const [logTab, setLogTab] = useState('system');
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);

      const [isMonitorRunning, setIsMonitorRunning] = useState(false);
      const [isFlashing, setIsFlashing] = useState(false);
      const [progress, setProgress] = useState(0);
      
      const terminalRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const isReadingRef = useRef(false);

      useEffect(() => {
        if (!('serial' in navigator)) setIsSerialSupported(false);

        // Fetch IP Geolocation to auto-set language
        fetch('https://get.geojs.io/v1/ip/country.json')
          .then(res => res.json())
          .then(data => {
            if (data.country === 'PH') setLang('fil');
            else setLang('en');
          })
          .catch(error => console.log('Không check được IP, dùng mặc định:', error));

        const savedConfig = localStorage.getItem('cltx4_web_flasher_config_public_1791892333988');
        if (savedConfig) {
          try {
            const parsed = JSON.parse(savedConfig);
            if (parsed.boards) setBoards(parsed.boards.map(b => ({ description: '', ...b })));
            if (Array.isArray(parsed.firmwareFamilies) && parsed.firmwareFamilies.length) setFirmwareFamilies(['All Firmware', ...parsed.firmwareFamilies.filter(f => f && f !== 'All Firmware')]);
            if (parsed.categoryDescriptions && typeof parsed.categoryDescriptions === 'object') setCategoryDescriptions({ ...INITIAL_CATEGORY_DESCRIPTIONS, ...parsed.categoryDescriptions });
            if (parsed.settings) {
              if (parsed.settings.bgUrl) setBgUrl(parsed.settings.bgUrl);
              if (parsed.settings.logoUrl) setLogoUrl(parsed.settings.logoUrl);
            }
          } catch(e) {}
        }
      }, []);

      // Check the selected board's GitHub-hosted firmware independently of local uploads.
      // A local .bin file must not hide whether the online firmware exists.
      useEffect(() => {
        let cancelled = false;
        const configuredUrl = selectedBoard && selectedBoard.url ? selectedBoard.url.trim() : '';
        if (!configuredUrl) {
          setGithubFirmwareStatus('unconfigured');
          setGithubFirmwareCheckedUrl('');
          return () => { cancelled = true; };
        }
        const url = /^https?:\/\//i.test(configuredUrl)
          ? configuredUrl
          : new URL(configuredUrl, GITHUB_BASE).href;
        setGithubFirmwareStatus('checking');
        setGithubFirmwareCheckedUrl(url);
        fetch(url, { method: 'HEAD', cache: 'no-store' })
          .then(response => {
            if (cancelled) return;
            setGithubFirmwareStatus(response.ok ? 'available' : 'missing');
          })
          .catch(() => {
            if (!cancelled) setGithubFirmwareStatus('error');
          });
        return () => { cancelled = true; };
      }, [selectedBoardId, boards]);

      useEffect(() => {
        if (terminalRef.current) {
          terminalRef.current.scrollTop = terminalRef.current.scrollHeight;
        }
      }, [sysLogs, devLogs, logTab]);

      const addSysLog = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type }]);
      };
      const addDevLog = (msg) => {
        setDevLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type: 'device' }]);
      };

      const startReadLoop = async (transport) => {
        isReadingRef.current = true;
        const currentPort = transport.device;
        try {
          while (currentPort.readable) {
            const reader = currentPort.readable.getReader();
            readerRef.current = reader;
            try {
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const text = new TextDecoder().decode(value);
                const lines = text.split('\n');
                lines.forEach(line => { if (line.trim()) addDevLog(line.trim()); });
              }
            } catch (error) { break; } 
            finally {
              reader.releaseLock();
              readerRef.current = null;
            }
          }
        } finally {
          isReadingRef.current = false;
        }
      };

      // =========================================================
      // CONNECT USB
      // =========================================================
      const handleConnect = async () => {
        if (!isSerialSupported) return;
        try {
          if (!window.esptooljs) {
            addSysLog(t("loadingLibrary"), "info");
            window.esptooljs = await window.esptoolPromise;
          }
          const selectedPort = await navigator.serial.requestPort();
          portRef.current = selectedPort;
          setIsConnected(true);
          addSysLog(t("portAuthorized"), "success");
        } catch (err) {
          addSysLog(`${t("connectError")}: ${err.message}`, "error");
        }
      };

      const stopMonitor = async () => {
        if (readerRef.current) await readerRef.current.cancel().catch(()=>{});
        while (isReadingRef.current) await new Promise(r => setTimeout(r, 50));
        if (transportRef.current) {
          await transportRef.current.disconnect().catch(()=>{});
          transportRef.current = null;
        }
        setIsMonitorRunning(false);
      };

      // =========================================================
      // START MONITOR
      // =========================================================
      const toggleSerialMonitor = async () => {
        if (isMonitorRunning) {
          await stopMonitor();
          addSysLog(t("monitorStopped"), "warning");
        } else {
          try {
            if (!portRef.current) return;
            const transport = new window.esptooljs.Transport(portRef.current);
            transportRef.current = transport;
            await transport.connect(115200); 
            setIsMonitorRunning(true);
            setLogTab('device');
            addSysLog(t("monitorStarted"), "success");
            startReadLoop(transport);
          } catch (err) {
            addSysLog(`${t("monitorError")}: ${err.message}`, "error");
          }
        }
      };

      const handleDisconnect = async () => {
        await stopMonitor();
        portRef.current = null;
        setIsConnected(false);
        addSysLog(t("disconnected"), "warning");
      };

      // =========================================================
      // FLASH FIRMWARE
      // =========================================================
      const handleFlash = async () => {
        if (!selectedBoard?.url && !localFile) return addSysLog(t("errNoFile"), "error");
        setIsFlashing(true);
        setProgress(0);
        setLogTab('system'); 

        try {
          await stopMonitor();
          await new Promise(r => setTimeout(r, 500));
          addSysLog(t("prepareFlash"), 'info');

          let firmwareString;
          if (localFile) {
             const reader = new FileReader();
             firmwareString = await new Promise((res, rej) => {
                 reader.onload = () => res(reader.result);
                 reader.onerror = rej;
                 reader.readAsBinaryString(localFile);
             });
          } else {
             addSysLog(t("downloadingFw"), "warning");
             const fetchUrl = (selectedBoard.url.startsWith('http')) ? selectedBoard.url : GITHUB_BASE + selectedBoard.url + '?t=' + new Date().getTime();
             const resp = await fetch(fetchUrl);
             if (!resp.ok) throw new Error(t("notFoundOnServer"));
             const blob = await resp.blob();
             const reader = new FileReader();
             firmwareString = await new Promise((res, rej) => {
                 reader.onload = () => res(reader.result);
                 reader.onerror = rej;
                 reader.readAsBinaryString(blob);
             });
          }

          addSysLog(t("syncing"), "warning");
          const transport = new window.esptooljs.Transport(portRef.current);
          const esploader = new window.esptooljs.ESPLoader({
            transport: transport,
            baudrate: parseInt(baudRate),
            romBaudrate: 115200,
            terminal: { clean: () => {}, writeLine: (msg) => addSysLog(msg), write: (msg) => addSysLog(msg) }
          });

          await esploader.main();
          addSysLog(`${t("chipDetected")}`, "success");

          const parsedAddress = Number.parseInt(String(flashAddress).trim().replace(/^0x/i, ''), 16);
          if (!Number.isFinite(parsedAddress) || parsedAddress < 0) throw new Error('Invalid flash address. Example: 0x0');
          await esploader.writeFlash({
            fileArray: [{ data: firmwareString, address: parsedAddress }],
            flashSize: 'keep',
            eraseAll: eraseAllFlash,
            compress: true,
            reportProgress: (idx, written, total) => setProgress(Math.round((written/total)*100))
          });

          addSysLog(t("flashSuccess"), "success");
          await esploader.hardReset();
          await transport.disconnect().catch(()=>{});
        } catch (error) {
          addSysLog(`${t("flashFailed")}: ${error.message}`, "error");
        } finally {
          setIsFlashing(false);
          setProgress(0);
        }
      };

      const handleAdminLogin = async (e) => {
        e.preventDefault();
        setLoginError(false);
        try {
          const msgBuffer = new TextEncoder().encode(adminInput);
          const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
          const hashHex = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
          if (hashHex === ADMIN_PASSWORD_HASH) {
            setIsAdmin(true); setShowAdminModal(false); setAdminInput("");
          } else setLoginError(true);
        } catch (error) {}
      };

      const saveAdminConfig = () => {
        localStorage.setItem('cltx4_web_flasher_config_public_1791892333988', JSON.stringify({ boards, firmwareFamilies: firmwareFamilies.filter(f => f !== 'All Firmware'), categoryDescriptions, settings: { bgUrl, logoUrl } }));
        alert("Saved!"); setIsAdmin(false);
      };

      const exportAdminConfig = () => {
        const payload = { app: 'CLTX4 WEB FLASHER', version: 3, exportedAt: new Date().toISOString(), boards, firmwareFamilies: firmwareFamilies.filter(f => f !== 'All Firmware'), categoryDescriptions, settings: { bgUrl, logoUrl } };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'cltx4-flasher-config.json'; a.click();
        URL.revokeObjectURL(url);
      };

      // Export a new, ready-to-commit index.html with current Admin edits baked into its defaults.
      // This lets the owner upload the downloaded HTML to GitHub Pages so every visitor sees the changes.
      const exportUpdatedIndexHtml = () => {
        try {
          // Export the actual app source, not React's currently-rendered UI markup.
          // Keep the source HTML and scripts intact, but clear the rendered root in the clone.
          const currentFamilies = firmwareFamilies.filter(f => f && f !== 'All Firmware');
          const config = {
            families: currentFamilies,
            descriptions: categoryDescriptions,
            boards: boards,
            settings: { bgUrl, logoUrl }
          };
          const sourceClone = document.documentElement.cloneNode(true);
          const clonedRoot = sourceClone.querySelector('#root');
          if (clonedRoot) clonedRoot.innerHTML = '';
          let html = '<!DOCTYPE html>\n' + sourceClone.outerHTML;
          const replaceDeclaration = (name, value) => {
            const pattern = new RegExp('const\\s+' + name + '\\s*=\\s*[\\[{][\\s\\S]*?;');
            if (!pattern.test(html)) throw new Error('Could not locate ' + name + ' in index.html');
            html = html.replace(pattern, 'const ' + name + ' = ' + JSON.stringify(value, null, 2) + ';');
          };
          replaceDeclaration('INITIAL_FIRMWARE_FAMILIES', config.families);
          replaceDeclaration('INITIAL_CATEGORY_DESCRIPTIONS', config.descriptions);
          replaceDeclaration('INITIAL_BOARDS', config.boards);
          replaceDeclaration('INITIAL_SETTINGS', config.settings);
          // Give the published build a fresh storage key so stale local settings from an older
          // build cannot override the defaults that were just exported for everyone.
          const publicStorageKey = 'cltx4_web_flasher_config_public_1791892333988' + Date.now();
          html = html.replace(/cltx4_web_flasher_config_[a-zA-Z0-9_]+/g, publicStorageKey);
          const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
          const downloadUrl = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = 'index.html';
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
          alert('Updated index.html downloaded! Replace the old index.html in your GitHub repository, then commit/push it to publish these Admin changes for everyone.');
        } catch (error) {
          console.error(error);
          alert('Could not export index.html: ' + error.message + '. You can still export the configuration JSON as a backup.');
        }
      };

      const importAdminConfig = (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

                <div className="rounded-xl border border-pink-500/30 bg-pink-500/5 p-4"><h3 className="font-bold text-white mb-1">Firmware Library Categories</h3><p className="text-xs text-slate-400">Add or rename options shown in the main Firmware Library. Everything is inside this index.html; use Save Config to store changes in this browser.</p></div>
                <div className="flex gap-2"><input value={newFamilyName} onChange={e => setNewFamilyName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addFirmwareFamily(); }} placeholder="New option e.g. ESP32 Marauder" className="min-w-0 flex-1 bg-slate-950 border border-slate-700 text-white text-sm rounded-xl px-3 py-3"/><button onClick={addFirmwareFamily} className="rounded-xl bg-emerald-600 px-4 py-3 text-white font-bold"><i className="fa-solid fa-plus mr-1"></i>Add</button></div>
                {firmwareFamilies.filter(f => f !== 'All Firmware').map(family => <div key={family} className="rounded-xl border border-slate-700 bg-slate-950 p-3 space-y-2"><div className="flex items-center gap-2"><div className="min-w-0 flex-1"><p className="text-sm font-bold text-white">{family}</p><p className="text-[10px] text-slate-500">{boards.filter(b => (b.family || 'Bruce Predatory') === family).length} board/firmware entries</p></div><button onClick={() => { const value = window.prompt('Rename firmware category:', family); if (value !== null) renameFirmwareFamily(family, value); }} title="Rename category" className="rounded-lg bg-slate-800 px-3 py-2 text-pink-300"><i className="fa-solid fa-pen"></i></button><button onClick={() => deleteFirmwareFamily(family)} title="Delete category" className="rounded-lg bg-rose-950 px-3 py-2 text-rose-300"><i className="fa-solid fa-trash"></i></button></div><label className="block text-[10px] uppercase tracking-wider text-slate-400">Category card description<textarea rows="2" value={categoryDescriptions[family] || ''} onChange={e => setCategoryDescriptions(prev => ({ ...prev, [family]: e.target.value }))} placeholder="Short description shown under this category on the main page" className="mt-1 w-full resize-y bg-slate-900 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 normal-case tracking-normal" /></label></div>)}
              </div>
            ) : adminTab === 'ui' ? (
              <div className="space-y-6">
                <div><label className="block text-xs font-medium text-slate-400 mb-2">{t('logoConfig')}</label><input type="text" placeholder="URL..." value={logoUrl} onChange={e => setLogoUrl(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-slate-300 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-pink-400" /></div>
                <div><label className="block text-xs font-medium text-slate-400 mb-2">{t('bgConfig')}</label><input type="text" placeholder="URL..." value={bgUrl} onChange={e => setBgUrl(e.target.value)} className="w-full bg-slate-950 border border-slate-700 text-slate-300 text-sm rounded-lg px-3 py-2.5 outline-none focus:border-pink-400" /></div>
              </div>
            ) : (
              <div className="space-y-4">
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4"><p className="text-white font-bold mb-1">Configuration overview</p><p className="text-xs text-slate-400">{boards.length} boards • {adminFamilies.length - 1} firmware categories • {boards.filter(b => b.url && b.url.trim()).length} configured links</p></div>
                <button onClick={exportUpdatedIndexHtml} className="w-full rounded-xl p-3 bg-pink-600 hover:bg-pink-500 text-white font-bold text-sm"><i className="fa-solid fa-file-code mr-2"></i>Export Updated index.html for GitHub</button>
                <p className="text-xs leading-relaxed text-slate-400">This downloads a new index.html with your current boards, firmware categories, descriptions, and appearance settings built in. Upload it to your GitHub repository to publish your edits to every visitor.</p>
                <button onClick={exportAdminConfig} className="w-full rounded-xl p-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm"><i className="fa-solid fa-file-export mr-2 text-pink-400"></i>Export configuration JSON backup</button>
                <label className="block w-full rounded-xl p-3 bg-slate-800 hover:bg-slate-700 text-white font-bold text-sm text-center cursor-pointer"><i className="fa-solid fa-file-import mr-2 text-pink-400"></i>Import configuration JSON<input type="file" accept=".json,application/json" onChange={importAdminConfig} className="hidden" /></label>
                <button onClick={resetAdminConfig} className="w-full rounded-xl p-3 bg-rose-950/70 hover:bg-rose-900 border border-rose-800 text-rose-200 font-bold text-sm"><i className="fa-solid fa-rotate-left mr-2"></i>Reset defaults</button>
                <p className="text-xs leading-relaxed text-amber-300/90">Save Config stores changes in this browser. Use Export Updated index.html for GitHub to make your edits public after committing the downloaded file. Export a JSON backup before clearing browser data. Admin login is client-side only, not secure server-side access control.</p>
              </div>
            )}
          </div>
        </div>
      );

      const currentLogs = logTab === 'system' ? sysLogs : devLogs;

      return (
        <div 
          className="min-h-screen bg-[#020617] text-slate-300 font-sans relative transition-all duration-500"
          style={{ backgroundImage: bgUrl ? `url(${bgUrl})` : 'none', backgroundSize: 'cover', backgroundPosition: 'center', backgroundAttachment: 'fixed' }}
        >
          <div className={`absolute inset-0 z-0 pointer-events-none transition-colors duration-500 ${bgUrl ? 'bg-slate-950/85 backdrop-blur-sm' : 'bg-transparent'}`}></div>

          <div className="max-w-7xl mx-auto space-y-6 relative z-10 p-4 md:p-8 cltx4-desktop-layout">
            
            {!isSerialSupported && (
              <div className="bg-amber-500/10 border border-amber-500/20 p-3 rounded-2xl flex items-center gap-3 animate-pulse">
                <i className="fa-solid fa-mobile-screen text-amber-500"></i>
                <div className="text-[11px] sm:text-xs text-amber-200">
                  <p className="font-bold">{t('browserNotSupported')}</p>
                  <p className="opacity-80">{t('browserNotSupportedDesc')}</p>
                </div>
              </div>
            )}

            <header className="flex flex-col md:flex-row items-start sm:items-center justify-between gap-6 border-b border-pink-400/20 pb-8">
              <div className="flex items-center gap-5">
                <div className="w-12 h-12 sm:w-16 sm:h-16 bg-pink-500/20 rounded-2xl flex items-center justify-center shadow-[0_0_15px_rgba(236,72,153,0.2)] border border-pink-400/30 overflow-hidden shrink-0">
                  {logoUrl ? <img src={logoUrl} alt="Logo" className="w-full h-full object-cover" /> : <i className="fa-solid fa-bolt text-[24px] sm:text-[36px] text-pink-400 drop-shadow-md"></i>}
                </div>
                <div>
                  <h1 className="text-xl sm:text-3xl font-black text-white tracking-tighter uppercase">{t('title')}</h1>
                  <p className="text-pink-300 font-medium text-[10px] sm:text-sm tracking-wide uppercase">{t('subtitle')}</p>
                  <p className="text-slate-400 text-[10px] sm:text-xs mt-2 max-w-xl">Educational tool for school labs, electronics learning, and personal ESP32 projects. Flash only firmware intended for your exact board.</p>
                </div>
              </div>

              <div className="flex items-center gap-2 sm:gap-3 w-full sm:w-auto overflow-x-auto no-scrollbar pb-2 sm:pb-0">
                  <button onClick={() => setLang(lang === 'en' ? 'fil' : 'en')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-white px-3 py-2 rounded-full font-bold shadow-lg transition-colors border border-slate-700 text-xs shrink-0"><i className="fa-solid fa-language text-pink-300"></i>{lang === 'en' ? 'FIL' : 'EN'}</button>
                  <button onClick={() => setShowDonateModal(true)} className="flex items-center gap-2 bg-gradient-to-br from-pink-500 to-rose-400 text-white px-4 py-2 rounded-full font-bold shadow-lg transition-transform hover:scale-105 active:scale-95 text-xs shrink-0"><i className="fa-solid fa-heart"></i>{t('donate')}</button>
                  <a href={GITHUB_REPO_LINK} target="_blank" rel="noopener noreferrer" className="w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center bg-slate-900 rounded-full border border-slate-700 hover:bg-slate-800 transition-colors shadow-xl shrink-0"><i className="fab fa-github text-slate-400 hover:text-pink-300 transition-colors"></i></a>
                  <button onClick={() => isAdmin ? setIsAdmin(false) : setShowAdminModal(true)} className="w-9 h-9 sm:w-11 sm:h-11 flex items-center justify-center bg-slate-900 rounded-full border border-slate-700 hover:bg-slate-800 transition-colors shadow-xl shrink-0"><i className={`fa-solid ${isAdmin ? 'fa-lock-open' : 'fa-lock'} text-slate-400 hover:text-pink-300 transition-colors`}></i></button>
              </div>
            </header>


            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div className="lg:col-span-5 space-y-6">{isAdmin ? AdminView : UserView}</div>
              <div className="lg:col-span-7 flex flex-col bg-slate-900/80 backdrop-blur-2xl border border-slate-800 rounded-3xl shadow-2xl h-[400px] sm:h-[640px] overflow-hidden">
                <div className="flex items-center justify-between p-4 border-b border-slate-800 bg-slate-900/50">
                  <div className="flex gap-3 sm:gap-4 overflow-x-auto no-scrollbar">
                    <button onClick={() => setLogTab('system')} className={`font-bold text-[10px] sm:text-sm transition-colors border-b-2 pb-1 shrink-0 ${logTab === 'system' ? 'text-pink-400 border-pink-400' : 'text-slate-500 border-transparent'}`}>{t('sysLogsTab')}</button>
                    <button onClick={() => setLogTab('device')} className={`font-bold text-[10px] sm:text-sm transition-colors border-b-2 pb-1 shrink-0 ${logTab === 'device' ? 'text-pink-400 border-pink-400' : 'text-slate-500 border-transparent'}`}>{t('devLogsTab')}</button>
                  </div>
                  <div className="flex items-center gap-1 sm:gap-2 shrink-0">
                    {logTab === 'device' && (
                      <button onClick={toggleSerialMonitor} disabled={isFlashing} className={`flex items-center gap-1.5 px-2 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-xs font-bold rounded-lg transition-all ${isMonitorRunning ? 'bg-rose-500/10 text-rose-500 hover:bg-rose-500/20' : 'bg-emerald-500/10 text-emerald-500 hover:bg-emerald-500/20'} disabled:opacity-50`}>
                        <i className={`fa-solid ${isMonitorRunning ? 'fa-stop' : 'fa-play'}`}></i><span className="hidden sm:inline ml-1">{isMonitorRunning ? t('stopMonitor') : t('startMonitor')}</span>
                      </button>
                    )}
                    <button onClick={() => logTab === 'system' ? setSysLogs([]) : setDevLogs([])} className="flex items-center gap-1.5 px-2 py-1 sm:px-3 sm:py-1.5 bg-slate-800 hover:bg-red-900/40 hover:text-red-400 text-[10px] sm:text-xs font-bold rounded-lg transition-all"><i className="fa-solid fa-trash-can"></i><span className="hidden sm:inline ml-1">{t('clearLogs')}</span></button>
                  </div>
                </div>
                <div ref={terminalRef} className="flex-1 p-5 overflow-y-auto font-mono text-[10px] sm:text-xs space-y-1.5 bg-[#050b14] custom-scrollbar select-text">
                  {currentLogs.length === 0 ? (
                    <div className="h-full flex items-center justify-center text-slate-700 italic">{t('waitingDevice')}</div>
                  ) : (
                    currentLogs.map((log, i) => (
                      <div key={i} className="flex min-w-0 gap-3 leading-relaxed border-b border-slate-800/20 pb-0.5 animate-in fade-in duration-300">
                        <span className="text-slate-600 shrink-0 select-none">[{log.time}]</span>
                        <span className={`min-w-0 break-words [overflow-wrap:anywhere] ${log.type === 'error' ? 'text-red-400 font-bold' : log.type === 'success' ? 'text-emerald-400 font-bold' : log.type === 'warning' ? 'text-pink-300' : 'text-slate-300'}`}>{log.msg}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          </div>

          {showDonateModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-[2.5rem] p-6 sm:p-8 text-center shadow-2xl relative">
                <button onClick={() => setShowDonateModal(false)} className="absolute top-6 right-6 text-slate-500 hover:text-white"><i className="fa-solid fa-xmark text-2xl"></i></button>
                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-pink-500/20 rounded-full flex items-center justify-center mx-auto mb-6"><i className="fa-solid fa-heart text-3xl sm:text-4xl text-pink-400 animate-pulse"></i></div>
                <h3 className="text-xl sm:text-2xl font-black text-white mb-2">{t('donateTitle')}</h3>
                <p className="text-slate-400 text-xs sm:text-sm mb-6 leading-relaxed">{t('donateDesc')}</p>
                <div className="bg-slate-950 border border-slate-700 rounded-2xl p-5 mb-6">
                  <p className="text-xs uppercase tracking-widest text-slate-500 mb-2">GCash Number</p>
                  <p className="text-2xl font-black tracking-wider text-white">{DONATE_GCASH}</p>
                  <p className="text-xs text-slate-400 mt-2">Support this school / DIY project only if you want to.</p>
                </div>
                <button onClick={async () => { try { await navigator.clipboard.writeText(DONATE_GCASH); } catch(e) { const el = document.createElement('textarea'); el.value = DONATE_GCASH; document.body.appendChild(el); el.select(); document.execCommand('copy'); el.remove(); } setCopied(true); setTimeout(() => setCopied(false), 2000); }} className="w-full py-3 rounded-xl font-medium text-pink-300 bg-pink-500/10 hover:bg-pink-500/20 transition-colors border border-pink-500/30 flex items-center justify-center gap-2 active:scale-95">{copied ? <i className="fa-solid fa-circle-check text-emerald-500"></i> : <i className="fa-solid fa-copy"></i>}{copied ? t('copied') : t('copyQr')}</button>
              </div>
            </div>
          )}

          {showAdminModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
                <h3 className="text-lg sm:text-xl font-bold text-white mb-2">{t('adminConfirm')}</h3>
                <p className="text-xs sm:text-sm text-slate-400 mb-6">{t('adminDesc')}</p>
                <form onSubmit={handleAdminLogin} className="space-y-4">
                  <input type="password" autoFocus placeholder={t('password')} value={adminInput} onChange={e => {setAdminInput(e.target.value); setLoginError(false);}} className={`w-full bg-slate-950 border rounded-xl p-4 text-white outline-none focus:ring-2 transition-all text-sm ${loginError ? 'border-red-500 ring-red-500/20' : 'border-slate-800 focus:ring-pink-400/20'}`} />
                  {loginError && <p className="text-red-500 text-[10px] font-bold uppercase">{t('wrongPassword')}</p>}
                  <div className="flex gap-3 pt-2">
                    <button type="button" onClick={() => setShowAdminModal(false)} className="flex-1 py-3 text-slate-400 font-bold hover:text-white text-xs">{t('cancel')}</button>
                    <button type="submit" className="flex-1 py-3 bg-pink-500 text-white font-bold rounded-xl hover:bg-pink-400 shadow-lg shadow-pink-500/30 text-xs">{t('unlock')}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: `
            .custom-scrollbar::-webkit-scrollbar { width: 4px; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
            .cltx4-desktop-layout { width: min(100%, 1440px); }
            .cltx4-desktop-layout p { line-height: 1.6; text-wrap: pretty; overflow-wrap: anywhere; }
            .cltx4-desktop-layout label { line-height: 1.45; }
            .cltx4-desktop-layout h1, .cltx4-desktop-layout h2, .cltx4-desktop-layout h3 { line-height: 1.25; overflow-wrap: anywhere; }
            .cltx4-desktop-layout button, .cltx4-desktop-layout a { white-space: normal; }
            @media (min-width: 1024px) {
              .cltx4-desktop-layout { padding-left: 2rem; padding-right: 2rem; }
              .cltx4-desktop-layout .grid { align-items: start; }
              .cltx4-desktop-layout .font-mono { overflow-wrap: anywhere; }
            }
          `}} />
        </div>
      );
    }

    const rootNode = document.getElementById('root');
    if (!rootNode._reactRoot) { rootNode._reactRoot = ReactDOM.createRoot(rootNode); }
    rootNode._reactRoot.render(<App />);
  </script>


</body></html>
